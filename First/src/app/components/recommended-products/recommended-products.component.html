<!-------recomended product --------->

<div class="row g-4">
    @for(product of productList;track product.id){

    @if(product.onSale){
    <div class="col-6 col-md-4 col-lg-3 ">

        <app-card [myData]="product"></app-card>
    </div>
    }

    }
    @empty {
    <div class="alert alert-light" role="alert">
        No Products Found ...
    </div>
    }
</div>
